name: Latest blog posts

on:
  schedule:
    - cron: '0 0 * * *' # every day 07:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://samsulhadiss.com/feed.xml'
          max_post_count: 5
          template: '- [$title]($url) <sub>· $date</sub>$newline'
          date_format: 'dd mmm yyyy'
          commit_message: 'chore: update latest blog posts'
